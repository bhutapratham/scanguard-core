<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanGuard AI - Security Header Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6">
  <div class="w-full max-w-2xl mt-12">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold mb-3">
        Autonomous Security Utility
      </div>
      <h1 class="text-4xl font-bold tracking-tight text-white mb-2">ScanGuard AI</h1>
      <p class="text-slate-400 text-sm">Instant HTTP security header & endpoint compliance auditor.</p>
    </div>

    <!-- Search Box -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl mb-6">
      <form id="scanForm" class="flex gap-3">
        <input
          type="text"
          id="urlInput"
          placeholder="e.g., github.com or google.com"
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500"
          required
        />
        <button
          type="submit"
          id="scanBtn"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-6 py-3 rounded-lg transition-colors flex items-center gap-2"
        >
          <span id="btnText">Scan Now</span>
          <span id="btnSpinner" class="hidden animate-spin">&#9696;</span>
        </button>
      </form>
      <div id="errorMsg" class="hidden mt-3 text-xs text-rose-400 bg-rose-950/30 border border-rose-900/50 p-2 rounded-lg"></div>
    </div>

    <!-- Results Section -->
    <div id="resultContainer" class="hidden space-y-6">
      <!-- Scorecard -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Target Endpoint</div>
          <div id="targetDisplay" class="text-base font-semibold text-white truncate max-w-xs md:max-w-md"></div>
          <div id="scoreSummary" class="text-xs text-slate-400 mt-1"></div>
        </div>
        <div id="gradeBadge" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-black border-4 shadow-lg"></div>
      </div>

      <!-- Headers Breakdown -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold text-slate-200 uppercase tracking-wider mb-4">Security Header Analysis</h3>
        <div id="headersList" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('scanForm');
    const input = document.getElementById('urlInput');
    const btn = document.getElementById('scanBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorMsg = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const targetDisplay = document.getElementById('targetDisplay');
    const scoreSummary = document.getElementById('scoreSummary');
    const gradeBadge = document.getElementById('gradeBadge');
    const headersList = document.getElementById('headersList');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const target = input.value.trim();
      if (!target) return;

      errorMsg.classList.add('hidden');
      resultContainer.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Auditing...';
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch(`/api/scan?url=${encodeURIComponent(target)}`);
        const data = await res.json();

        if (!res.ok || data.error) {
          throw new Error(data.error || 'Failed to scan target endpoint');
        }

        renderResults(data);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Scan Now';
        btnSpinner.classList.add('hidden');
      }
    });

    function renderResults(data) {
      targetDisplay.textContent = data.url;
      scoreSummary.textContent = `${data.score} of ${data.total} critical headers present (${Math.round(data.percentage)}%)`;
      gradeBadge.textContent = data.grade;

      gradeBadge.className = 'w-16 h-16 rounded-full flex items-center justify-center text-3xl font-black border-4 shadow-lg ';
      if (data.grade === 'A') {
        gradeBadge.classList.add('bg-emerald-950/60', 'text-emerald-400', 'border-emerald-500/80');
      } else if (data.grade === 'B') {
        gradeBadge.classList.add('bg-blue-950/60', 'text-blue-400', 'border-blue-500/80');
      } else if (data.grade === 'C') {
        gradeBadge.classList.add('bg-amber-950/60', 'text-amber-400', 'border-amber-500/80');
      } else {
        gradeBadge.classList.add('bg-rose-950/60', 'text-rose-400', 'border-rose-500/80');
      }

      headersList.innerHTML = '';
      data.details.forEach((item) => {
        const row = document.createElement('div');
        row.className = `p-3 rounded-lg border text-xs flex flex-col gap-1 ${
          item.present
            ? 'bg-emerald-950/20 border-emerald-800/40 text-emerald-300'
            : 'bg-rose-950/20 border-rose-800/40 text-rose-300'
        }`;

        row.innerHTML = `
          <div class="flex items-center justify-between font-mono font-bold">
            <span>${item.header}</span>
            <span class="px-2 py-0.5 rounded text-[10px] uppercase font-semibold ${
              item.present ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
            }">
              ${item.present ? 'PASS' : 'MISSING'}
            </span>
          </div>
          <div class="text-slate-400 font-sans">${item.description}</div>
          ${item.present && item.value ? `<div class="text-slate-500 font-mono text-[10px] truncate">Value: ${item.value}</div>` : ''}
        `;
        headersList.appendChild(row);
      });

      resultContainer.classList.remove('hidden');
    }
  </script>
</body>
</html>
